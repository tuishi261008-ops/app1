name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install Cordova
        run: npm install -g cordova

      - name: Build
        run: |
          cordova create app com.example.hbrowser HeaderlessApp
          cp index.html app/www/index.html
          cd app
          sed -i 's#</widget>#<preference name="Fullscreen" value="true"/><preference name="Orientation" value="portrait"/></widget>#' config.xml
          cordova platform add android
          cordova build android --debug

      - uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: app/platforms/android/app/build/outputs/apk/debug/*.apk

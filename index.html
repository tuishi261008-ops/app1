'位置情報の設定':()=>`<div class="fl"><div class="fh">位置情報サービス</div>${[['位置情報の使用','現在地の共有に使われます',1],['高精度モード','Wi-Fi とモバイル ネットワークで位置を補正',1],['位置情報の履歴','移動の履歴を保存しません',0],['スキャンの許可','Wi-Fi と Bluetooth のスキャン',1]].map(x=>`<div class="fr" data-pw><div><div class="a">${x[0]}</div><div class="b">${x[1]}</div></div><div class="tg2${x[2]?' on':''}"><i></i></div></div>`).join('')}</div>${ft()}`,
'今日の上限':()=>{const C=2*Math.PI*88;return `<div class="rg"><svg viewBox="0 0 220 220"><circle cx="110" cy="110" r="88" fill="none" stroke="var(--line)" stroke-width="18"/><circle cx="110" cy="110" r="88" fill="none" stroke="#ff9100" stroke-width="18" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}" transform="rotate(-90 110 110)"><animate attributeName="stroke-dashoffset" from="${C}" to="0" dur="1.2s" fill="freeze"/></circle></svg><div class="rc"><b>2 時間</b><span>使用済み / 上限 2 時間</span></div></div><div class="wc" data-pw>${['日','月','火','水','木','金','土'].map(k=>`<div><i></i>${k}</div>`).join('')}</div><div class="sec">上限に達すると</div><div class="stp"><div><b>1</b>残り 5 分でお知らせが届きます</div><div><b>2</b>デバイスがロックされます</div><div><b>3</b>電話は引き続き使えます</div></div>${ft()}`},
'Google Play':()=>`<div class="age"><b>12+</b><span>対象年齢</span></div><div class="flw"><div><i>${ic('padd',22)}</i>アプリを選ぶ</div><u>→</u><div class="lk2"><i>${ic('lock',22)}</i>保護者が承認</div><u>→</u><div><i>${ic('home',22)}</i>インストール</div></div><div class="sec">承認が必要な操作</div><div class="chs"><span data-pw>アプリのダウンロード</span><span data-pw>アプリ内購入</span><span data-pw>有料コンテンツ</span></div>${ft()}`,
'YouTube ファミリー センター':()=>`<div class="cmp"><div class="cd" data-pw><i>${ic('ppl',28)}</i><b>12 歳以下</b><small>YouTube Kids</small></div><div class="cd on" data-pw><s>✓</s><i>${ic('person',28)}</i><b>13 歳以上</b><small>管理された YouTube</small></div></div><ul class="bl"><li>再生履歴は保存されません</li><li>年齢に合った動画だけがおすすめされます</li></ul>${ft()}`,
'Google Chrome とウェブ':()=>`<div class="br"><div class="ad">${ic('lock',14)}<span>example-site.com/…</span></div><div class="pg">${ic('block',54,'#f28b82')}<b>このサイトはブロックされています</b><small>保護者がフィルタを設定しています</small></div></div><div class="seg">${['許可したサイトのみ','不適切なサイトをブロック','制限なし'].map((x,i)=>`<span data-pw class="${i===1?'on':''}">${x}</span>`).join('')}</div>${ft()}`,
'Google 検索':()=>`<div class="sb2"><b>G</b><span>検索</span>${ic('mic',20)}</div><div class="sf">${ic('block',16)}セーフサーチ ON</div><div class="rs">${[80,64,72].map(w=>`<div class="rr"><i style="width:${w}%"></i><i style="width:${w-30}%"></i></div>`).join('')}<div class="ov2">${ic('lock',30)}<b>不適切な結果は表示されません</b></div></div>${ft('セーフサーチは変更できません。')}`,
'Gemini':()=>`<div class="gm"><svg viewBox="0 0 24 24" width="96"><defs><linearGradient id="gg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4285f4"/><stop offset="1" stop-color="#c58af9"/></linearGradient></defs><path fill="url(#gg)" d="M12 1c.6 6.4 4.6 10.4 11 11-6.4.6-10.4 4.6-11 11-.6-6.4-4.6-10.4-11-11C7.4 11.4 11.4 7.4 12 1z"/></svg></div><div class="sec">利用できる機能</div><div class="cl2">${[['質問に答える',1],['文章を書く',1],['宿題のヒント',1],['画像の生成',0],['コードの作成',0]].map(x=>`<span class="${x[1]?'y':'n'}" data-pw>${x[1]?'✓':ic('lock',12)} ${x[0]}</span>`).join('')}</div>${ft()}`,
'Google アシスタント':()=>`<div class="wv">${Array.from({length:27},(_,i)=>`<i style="height:${10+Math.round(Math.abs(Math.sin(i*.7))*42)}px"></i>`).join('')}</div><div class="mk">${ic('mic',34)}</div><div class="two" style="margin-top:22px"><div class="tl3 on" data-pw><b>利用</b><span>ON</span></div><div class="tl3" data-pw><b>音声での購入</b><span>OFF</span></div></div>${ft()}`,
'アカウント設定':(sub)=>`<div class="idc"><div class="rib">保護者が管理</div><div class="av5">${ic('person',40)}</div><b>${sub}</b><small>Google アカウント</small></div><div class="kv">${[['アカウントの種類','保護者が管理'],['お子様の名前','非公開'],['生年月日','非公開'],['ログイン','このデバイス']].map(x=>`<div data-pw><span>${x[0]}</span><i></i><em>${x[1]}</em></div>`).join('')}</div>${ft()}`,
'デバイスを健康的に使用する方法':()=>`<div class="car">${[['moon','#3b3f8f','休息時間を活用する','寝る前の 1 時間は画面を見ない習慣をつけましょう。'],['timer','#1f7a4d','こまめに休憩する','30 分ごとに目を休めて、体を動かしましょう。'],['info','#a8641a','通知を減らす','必要のない通知は切って、集中しやすくしましょう。']].map((x,i)=>`<div style="background:${x[1]}"><span>${i+1} / 3</span>${ic(x[0],44,'#ffffffd9')}<b>${x[2]}</b><p>${x[3]}</p></div>`).join('')}</div><p class="d" style="text-align:center">横にスワイプしてヒントを見る</p>`};
function dlg(t,x,b){const m=document.createElement('div');m.className='mod';m.innerHTML=`<div class="mb"><h4>${t}</h4><p>${x}</p><div class="ma">${b.map((q,i)=>`<span data-i="${i}">${q[0]}</span>`).join('')}</div></div>`;m.onclick=e=>{const c=e.target.closest('[data-i]');if(c||e.target===m){m.remove();if(c&&b[c.dataset.i][1])b[c.dataset.i][1]()}};document.body.appendChild(m)}
function askPw(el){let sh=el.querySelector('.sheet');if(!sh){el.insertAdjacentHTML('beforeend',SHEET);sh=el.querySelector('.sheet')}const i=sh.querySelector('#pw');i.value='';i.type='password';sh.querySelector('.fld').classList.remove('bad');sh.querySelector('#err').style.display='none';sh.querySelector('#eye .cb').classList.add('off');requestAnimationFrame(()=>requestAnimationFrame(()=>{sh.classList.add('open');setTimeout(()=>{try{i.focus()}catch(_){}},350)}))}
function callTo(n){CALLN=n;push('call')}
function startCall(el){const cs=el.querySelector('#cs');setTimeout(()=>{if(!el.isConnected)return;let n=0;cs.textContent='00:00';const iv=setInterval(()=>{if(!el.isConnected){clearInterval(iv);return}n++;cs.textContent=String(n/60|0).padStart(2,'0')+':'+String(n%60).padStart(2,'0')},1000)},2200)}
function pfilter(el){const q=el.querySelector('#psi').value.trim().toLowerCase();const ci=[...el.querySelectorAll('.pchip')].findIndex(c=>c.classList.contains('on'));let n=0;el.querySelectorAll('.plist .pr').forEach(r=>{const ok=(!q||r.dataset.call.toLowerCase().includes(q))&&(ci!==1||r.dataset.t==='miss')&&(ci!==2||r.querySelector('.biz'));r.style.display=ok?'':'none';if(ok)n++});el.querySelector('#pempty').style.display=n?'none':'flex';el.querySelector('.psec').style.display=n?'':'none'}
function hpush(){try{history.pushState({},'');hd++}catch(e){}}
function closeLayer(){const md=document.querySelector('.mod');if(md){md.remove();return true}const t=stack[stack.length-1];if(!t)return false;const o=t.querySelector('.drawer.open,.sheet.open,.pad.open');if(!o)return false;if(o.classList.contains('pad'))padTo(t,false);else o.classList.remove('open');return true}
function back(){if(closeLayer())return;if(stack.length<2)return;if(hd>0)history.back();else pop()}
window.addEventListener('popstate',()=>{if(hd>0)hd--;if(closeLayer()){hpush();return}pop()});
function padTo(el,on){el.querySelector('.pad').classList.toggle('open',on);el.querySelector('#pKey').classList.toggle('act',on);el.querySelector('#pHome').classList.toggle('act',!on)}
const PN=['09000000001','05000000002','09000000003'];
function fmtJP(v){return /^0\d{3,}$/.test(v)?v.slice(0,3)+'-'+v.slice(3,7)+(v.length>7?'-'+v.slice(7):''):v}
function pdial(el,k){const d=el.querySelector('#pv');let v=d.dataset.v||'';v=k==='<'?v.slice(0,-1):(v+k).slice(0,13);d.dataset.v=v;d.textContent=fmtJP(v);const m=/^\d+$/.test(v)?PN.find(n=>n.startsWith(v)):null;const f=m?fmtJP(m):'';el.querySelector('#psug').innerHTML=m?`<div>候補</div><div class="pr" data-call="${f}"><div class="pav">${svg('person','')}</div><div class="m"><div class="n">${f}</div><div class="s">携帯 ${f}</div></div>${svg('call','')}</div>`:''}
function push(name,dir){
  const L=dir==='L';
  const el=document.createElement('div');el.className='screen'+(stack.length?(L?' offL':' off'):'');el.innerHTML=screens[name]();el.dataset.name=name;el.dataset.dir=L?'L':'R';
  app.appendChild(el);
  const prev=stack[stack.length-1];
  stack.push(el);wire(el);
  if(prev){requestAnimationFrame(()=>requestAnimationFrame(()=>{el.classList.remove('off','offL');prev.classList.add(L?'underR':'under')}))}
  if(name==='loading'){setTimeout(()=>{if(stack[stack.length-1]===el){replace('family')}},1500)}
  if(name==='call')startCall(el);if(prev)hpush();
}
function replace(name){
  const old=stack.pop();const prev=stack[stack.length-1];
  const el=document.createElement('div');el.className='screen';el.innerHTML=screens[name]();el.dataset.name=name;
  app.appendChild(el);stack.push(el);wire(el);old.remove();
}
function pop(){
  if(stack.length<2)return;
  const el=stack.pop();const prev=stack[stack.length-1];
  el.classList.add(el.dataset.dir==='L'?'offL':'off');prev.classList.remove('under','underR');
  setTimeout(()=>el.remove(),320);
}
function wire(el){
  const body=el.querySelector('.body'),b=el.querySelector('.bar');
  if(body&&b){const h1=body.querySelector('h1');
    body.addEventListener('scroll',()=>{const lim=h1?h1.offsetTop+h1.offsetHeight-20:10;b.classList.toggle('on',body.scrollTop>(el.dataset.name==='main'?lim:lim-10)||body.scrollTop>4&&!h1)},{passive:true})}
  el.addEventListener('click',e=>{
    const t=e.target;
    if(t.closest('[data-back]'))return back();
    if(t.closest('[data-more]')){e.stopPropagation();const m=document.getElementById('menu');m.style.display=m.style.display==='block'?'none':'block';return}
    const g=t.closest('[data-go]');
    if(g){const n=g.dataset.go;document.querySelectorAll('.drawer.open').forEach(d=>d.classList.remove('open'));if(n==='advanced')return push('loading');if(n.startsWith('x:')){XK=n.slice(2);return push('x')}return push(n,n==='phone'?'L':'')}
    const ts=t.closest('[data-toast]');if(ts)return toast(ts.dataset.toast);
    const cb=t.closest('[data-cb]');if(cb)return askPw(el);
    if(t.closest('#req'))return askPw(el);
    if(t.id==='scrim'){el.querySelector('.sheet').classList.remove('open');return}
    if(t.closest('#next')){const nb=el.querySelector('#next');if(nb.dataset.busy)return;nb.dataset.busy=1;nb.innerHTML='<i class="sp2"></i>';const f=el.querySelector('.fld');f.classList.remove('bad');el.querySelector('#err').style.display='none';setTimeout(()=>{nb.innerHTML='次へ';delete nb.dataset.busy;f.classList.add('bad');el.querySelector('#err').style.display='block';f.classList.remove('shake');void f.offsetWidth;f.classList.add('shake');try{navigator.vibrate&&navigator.vibrate([40,40,40])}catch(_){}},900);return}
    const ey=t.closest('#eye');if(ey){const p=el.querySelector('#pw');p.type=p.type==='password'?'text':'password';ey.querySelector('.cb').classList.toggle('off');return}
    const k=t.closest('[data-k]');if(k){el.querySelector('#dsp').textContent+=k.dataset.k;return}
    if(t.closest('#bs')){const d=el.querySelector('#dsp');d.textContent=d.textContent.slice(0,-1);return}
    if(t.closest('#call'))return toast('発信はこのデモでは使えません');
    if(t.closest('[data-help]'))return dlg('ヘルプ','この画面では、保護者が設定した利用制限を確認できます。変更したいときは、保護者の方にリクエストを送ってください。',[['閉じる']]);
    const cl=t.closest('[data-call]');if(cl)return callTo(cl.dataset.call);
    if(t.closest('[data-tcb]'))return askPw(el);
    const tgl=t.closest('[data-tg]');if(tgl){const sw=tgl.querySelector('.tg2');if(sw)sw.classList.toggle('on');try{navigator.vibrate&&navigator.vibrate(8)}catch(_){}return}
    const ctg=t.closest('[data-ct]');if(ctg){ctg.classList.toggle('on');return}
    if(t.closest('[data-pw]'))return askPw(el);
    if(t.closest('[data-endcall]'))return back();
    const xq=t.closest('#xreq');if(xq){if(!xq.dataset.d){xq.dataset.d=1;xq.textContent='✓ リクエスト送信済み';xq.style.opacity=.6;toast('保護者にリクエストを送信しました')}return}
    if(t.closest('#forgot'))return dlg('パスワードをお忘れの場合','保護者の方のパスワードの再設定は、保護者の方の Google アカウントでお手続きください。',[['OK']]);
    if(t.closest('.ph')){
      if(t.closest('#pmenu')){el.querySelector('.drawer').classList.add('open');return}
      if(t.classList.contains('dscrim')){el.querySelector('.drawer').classList.remove('open');return}
      if(t.closest('#pKey')){padTo(el,true);return}
      if(t.closest('#pHome')){padTo(el,false);return}
      const c=t.closest('.pchip');if(c){el.querySelectorAll('.pchip').forEach(x=>x.classList.remove('on'));c.classList.add('on');pfilter(el);return}
      const pk=t.closest('[data-pk]');if(pk){pdial(el,pk.dataset.pk);return}
      if(t.closest('#pbs')){pdial(el,'<');return}
      if(t.closest('#pgo')){const v=el.querySelector('#pv').dataset.v;return v?callTo(fmtJP(v)):toast('番号を入力してください')}
      if(t.closest('#pmic')){el.querySelector('#psi').focus();return}
      if(t.closest('#pfv')){const a=el.querySelector('.padd'),o=a.style.display==='none';a.style.display=o?'':'none';t.closest('#pfv').querySelector('svg').style.transform=o?'':'rotate(180deg)';return}
      if(t.closest('#pdel')){el.querySelector('.drawer').classList.remove('open');dlg('通話履歴を削除','すべての通話履歴を削除しますか？この操作は元に戻せません。',[['キャンセル'],['削除',()=>{el.querySelectorAll('.plist .pr').forEach(r=>r.remove());pfilter(el)}]]);return}
      if(t.closest('#phelp')){el.querySelector('.drawer').classList.remove('open');dlg('ヘルプとフィードバック','電話アプリの使い方は、ヘルプセンターで確認できます。ご意見はフィードバックから送信できます。',[['閉じる']]);return}
    }
    if(t.closest('#sched'))return askPw(el);
    if(t.closest('#showAll')){const l=el.querySelector('#moreL'),s=t.closest('#showAll');l.style.display='block';s.style.display='none'}
  });
}

const de=document.documentElement;
document.addEventListener('click',e=>{const m=document.getElementById('menu');if(!e.target.closest('#menu'))m.style.display='none'});
document.getElementById('mTh').onclick=()=>{const c=de.dataset.theme==='light'||(!de.dataset.theme&&matchMedia('(prefers-color-scheme:light)').matches);de.dataset.theme=c?'dark':'light'};
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'){if(e.key==='Enter'&&e.target.id==='pw'){const n=e.target.closest('.sheet').querySelector('#next');if(n)n.click()}return}if(e.key==='Escape'||e.key==='Backspace')back()});

const RS='.row:not(.ro),.gi,.pr,.pk,.rb,.pl,.di,.pchip,.pgo,.chip,.sw,.bt button,.btn,.pn i,.ib';
document.addEventListener('pointerdown',e=>{const h=e.target.closest&&e.target.closest(RS);if(!h)return;const r=h.getBoundingClientRect(),d=Math.max(r.width,r.height)*2,x=document.createElement('span');x.className='rp';x.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;h.appendChild(x);setTimeout(()=>x.remove(),650);if(h.matches('.pk,.pn i')){try{navigator.vibrate&&navigator.vibrate(8)}catch(_){}}});
document.addEventListener('pointerdown',()=>{try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{})}catch(_){}},{once:true});
document.addEventListener('input',e=>{if(e.target.id==='psi')pfilter(e.target.closest('.screen'));if(e.target.id==='pw'){e.target.parentNode.classList.remove('bad');const r=e.target.closest('.sheet').querySelector('#err');if(r)r.style.display='none'}});
push('lock');
</script>
